  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAIRYCOM | Insumos Lácteos B2B | Grupo Proselacsa</title>
    
    <meta name="description" content="Plataforma inteligente B2B para la compra de insumos lácteos en México, respaldada por Grupo Proselacsa.">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dairy: { blue: '#0A2540', lightBlue: '#1D4ED8', green: '#00A859', gray: '#F3F4F6', accent: '#FBBF24' }
                    }

            }

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #F9FAFB; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL del backend en Render. Todas las llamadas al ERP (Odoo) y pagos pasan por aquí.
        const API_BASE_URL = "https://dairycom-api.onrender.com";

        // Helper único para enviar cualquier formulario del sitio a /api/lead.
        // Antes, los formularios solo mostraban un mensaje de "enviado" falso
        // y nunca llamaban al backend, por eso ningún correo llegaba.
        async function enviarLead(payload) {
            const response = await fetch(`${API_BASE_URL}/api/lead`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!data.success) {
                throw new Error(data.error || "No se pudo enviar la solicitud");
            }
            return data;
        }

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [toastMsg, setToastMsg] = useState('');
            const [modalConfig, setModalConfig] = useState({ isOpen: false, activeTab: 'cotizar' });

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 4000);
            };

            const openModal = (tab) => {
                setModalConfig({ isOpen: true, activeTab: tab });
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Navigation */}
                    <nav className="bg-dairy-blue text-white sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-20 items-center">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentPage('home')}>
                                    <a href="https://www.proselacsa.com" target="_blank" title="Visitar Grupo Proselacsa" className="flex items-center hover:opacity-80 transition">
                                        <div className="w-14 h-11 bg-white/10 rounded-lg flex items-center justify-center p-1.5 border border-white/20 shadow-inner overflow-hidden">
                                            {/* IMAGEN LOCAL DEL LOGO BLANCO */}
                                            <img 
                                                src="./Logo Proselacsa Blanco.png" 
                                                alt="Proselacsa" 
                                                className="w-full h-full object-contain filter brightness-0 invert" 
                                                onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='block';}} 
                                            />

                                                <path d="M15 20 C15 15, 20 15, 25 15 L75 15 C85 15, 90 20, 90 30 L90 70 C90 80, 85 85, 75 85 L25 85 C20 85, 15 80, 15 70 Z" fill="none" stroke="white" strokeWidth="8"/>
                                                <path d="M30 40 Q 50 25, 70 40 T 70 65 Q 50 80, 30 65 Z" fill="none" stroke="white" strokeWidth="6"/>
                                                <text x="35" y="62" fontFamily="sans-serif" fontWeight="bold" fontSize="36" fill="white">P</text>
                                            </svg>
                                        </div>
                                    </a>
                                    <div>
                                        <div className="text-2xl font-bold tracking-tighter">DAIRYCOM</div>
                                        <a href="https://www.proselacsa.com" target="_blank" className="text-[11px] text-blue-300 font-light hover:underline block">
                                            A member of Grupo Proselacsa
                                        </a>
                                    </div>
                                </div>
                                
                                {/* Desktop Menu */}
                                <div className="hidden lg:flex space-x-6 items-center font-medium text-sm">

                                    <button onClick={() => setCurrentPage('productos')} className={`hover:text-dairy-green transition-colors ${currentPage==='productos'?'text-dairy-green':''}`}>Catálogo</button>

                                    <button onClick={() => setCurrentPage('envios')} className={`hover:text-dairy-green transition-colors ${currentPage==='envios'?'text-dairy-green':''}`}>Envíos</button>

                            </div>
                            <div>

                    {/* Modal Dual Controlado */}
                    {modalConfig.isOpen && <LeadModal closeModal={() => setModalConfig({ ...modalConfig, isOpen: false })} initialTab={modalConfig.activeTab} showToast={showToast} />}

                            <i className="ph ph-info mr-3 text-dairy-accent text-xl"></i> {toastMsg}
                        </div>
                    )}
                </div>
            );
        };

        /* ==================== COMPONENTES DE PÁGINA ==================== */

                {/* Ticker Superior con Tipo de Cambio */}

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-32 relative z-10">

                            <div className="inline-flex items-center space-x-2 bg-dairy-green/20 border border-dairy-green/40 text-dairy-green px-3.5 py-1.5 rounded-full text-xs font-semibold mb-6">

                            </div>

                            </h1>
                            
                            <p className="text-lg md:text-xl font-light mb-10 text-gray-300 leading-relaxed">
                                Compra leche en polvo, sueros y grasas lácteas a menudeo y medio mayoreo con disponibilidad inmediata desde nuestro CEDIS en León, Gto. 
                            </p>
                            
                            <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mb-12">

                                    <i className="ph ph-shopping-cart mr-2 text-2xl"></i> Solicitar Cotización (Stock)
                                </button>
                                <button onClick={() => openModal('sugerir')} className="bg-transparent border-2 border-white text-white px-8 py-4 rounded-lg font-bold hover:bg-white hover:text-dairy-blue transition shadow-lg flex items-center justify-center text-lg">
                                    <i className="ph ph-lightbulb mr-2 text-2xl"></i> Proponer Nuevos Insumos
                                </button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-8 border-t border-blue-900/60">
                                <div className="flex items-center space-x-3">
                                    <i className="ph ph-shield-check text-2xl text-dairy-green"></i>
                                    <span className="text-xs text-gray-300 font-medium">Insumos Grado Alimenticio (Normas NOM y COA)</span>
                                </div>
                                <div className="flex items-center space-x-3">

                                    <span className="text-xs text-gray-300 font-medium">CEDIS Estratégico en León (Bajío y Los Altos)</span>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <i className="ph ph-cpu text-2xl text-blue-400"></i>
                                    <span className="text-xs text-gray-300 font-medium">Sincronización Odoo ERP en Tiempo Real</span>
                                </div>
                            </div>

                </div>

                {/* Quick Navigation Cards */}

                    <div className="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                        <div className="p-4 cursor-pointer group rounded-lg hover:bg-gray-50 transition" onClick={() => setCurrentPage('mercado')}>
                            <i className="ph ph-trend-up text-4xl text-dairy-blue mb-2 group-hover:text-dairy-green transition"></i>
                            <h3 className="font-semibold text-gray-800">Precios de Mercado</h3>

                            <p className="text-xs text-gray-500 mt-1">Ingenieros de alimentos</p>
                        </div>
                    </div>
                </div>
            </div>
        );

            };

            return (
                <div className="py-16 bg-white fade-in min-h-screen">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid md:grid-cols-2 gap-16">
                        <div>
                            <h2 className="text-4xl font-bold text-dairy-blue mb-6">Contacto y Asesoría Técnica</h2>
                            <p className="text-gray-600 mb-10 text-lg leading-relaxed">
                                ¿Necesitas optimizar el rendimiento de tu producción con leche en polvo? Nuestro equipo de ingenieros de alimentos está listo para asesorarte con fichas técnicas y formulaciones específicas para tu industria.
                            </p>
                            
                            <div className="space-y-8">
                                <div className="flex items-start">
                                    <div className="bg-blue-50 p-4 rounded-xl text-dairy-blue mr-5">
                                        <i className="ph ph-map-pin text-3xl"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-xl text-gray-900">Ubicación CEDIS Central</h4>
                                        <p className="text-base text-gray-600 mt-2">León, Guanajuato, México.<br/>Cobertura logística principal: El Bajío y Los Altos de Jalisco.</p>
                                    </div>
                                </div>
                                <div className="flex items-start">
                                    <div className="bg-blue-50 p-4 rounded-xl text-dairy-blue mr-5">
                                        <i className="ph ph-envelope text-3xl"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-xl text-gray-900">Correo Corporativo</h4>
                                        <p className="text-base text-gray-600 mt-2">ventas@proselacsa.com</p>
                                    </div>
                                </div>
                                <div className="flex items-start">
                                    <div className="bg-blue-50 p-4 rounded-xl text-dairy-blue mr-5">
                                        <i className="ph ph-phone text-3xl"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-xl text-gray-900">Teléfono Directo</h4>
                                        <p className="text-base text-gray-600 mt-2">479 104 5539</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-gray-50 p-10 rounded-2xl border border-gray-200 shadow-lg">
                            <h3 className="text-2xl font-bold text-gray-800 mb-8">Envíanos un mensaje</h3>
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Nombre o Empresa</label>
                                    <input name="nombre" required type="text" className="w-full border border-gray-300 rounded-lg p-3 text-base focus:border-dairy-blue outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Correo Corporativo</label>
                                    <input name="email" required type="email" className="w-full border border-gray-300 rounded-lg p-3 text-base focus:border-dairy-blue outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Teléfono / WhatsApp</label>
                                    <input name="telefono" required type="tel" className="w-full border border-gray-300 rounded-lg p-3 text-base focus:border-dairy-blue outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">Requerimiento Específico</label>
                                    <textarea name="mensaje" required rows="4" className="w-full border border-gray-300 rounded-lg p-3 text-base focus:border-dairy-blue outline-none resize-none"></textarea>
                                </div>
                                <button type="submit" disabled={enviando} className="w-full bg-dairy-green text-white font-bold py-4 rounded-lg hover:bg-green-600 transition text-lg mt-2 shadow disabled:opacity-60">
                                    {enviando ? 'Enviando...' : 'Enviar Consulta'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const Comprar = ({ showToast }) => {
            const [monto, setMonto] = useState('');
            const [descripcion, setDescripcion] = useState('Compra de Insumos Lácteos DAIRYCOM');
            const [pagando, setPagando] = useState(null); // 'clip' | 'paypal' | null

            const handleCopy = (text, type) => {
                navigator.clipboard.writeText(text);
                showToast(`${type} copiada al portapapeles`);
            };

            const pagarCon = async (metodo) => {
                const amount = parseFloat(monto);
                if (!amount || amount <= 0) {
                    showToast("Ingresa un monto válido antes de continuar");
                    return;
                }
                setPagando(metodo);
                try {
                    const res = await fetch(`${API_BASE_URL}/api/pagar/${metodo}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ amount, currency: "MXN", description: descripcion })
                    });
                    const data = await res.json();
                    if (data.payment_url) {
                        window.location.href = data.payment_url;
                    } else {
                        showToast(`No se pudo generar el link de pago: ${data.error || 'Error desconocido'}`);
                    }
                } catch (err) {
                    showToast(`Error al conectar con el servidor de pagos: ${err.message}`);
                } finally {
                    setPagando(null);
                }
            };

            return (
                <div className="py-16 bg-gray-100 fade-in min-h-screen">
                    <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-bold text-dairy-blue mb-4">Portal de Compra Segura</h2>
                            <p className="text-gray-600 text-lg">Seleccione el método de pago para liquidar su pedido u orden de venta Odoo.</p>
                        </div>

                        <div className="max-w-md mx-auto mb-10 bg-white rounded-xl shadow p-6 border border-gray-200">
                            <label className="block text-sm font-bold text-gray-700 mb-2">Monto a Pagar (MXN)</label>
                            <input type="number" min="1" step="0.01" value={monto} onChange={e => setMonto(e.target.value)} placeholder="Ej. 15000.00" className="w-full border border-gray-300 rounded-lg p-3 text-lg font-bold text-dairy-blue focus:border-dairy-blue outline-none mb-3" />
                            <label className="block text-sm font-bold text-gray-700 mb-2">Concepto</label>
                            <input type="text" value={descripcion} onChange={e => setDescripcion(e.target.value)} className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:border-dairy-blue outline-none" />
                        </div>

                        <div className="grid md:grid-cols-2 gap-10">
                            <div className="bg-white rounded-2xl shadow-xl border-t-8 border-dairy-blue overflow-hidden relative">
                                <div className="absolute top-6 right-6 bg-green-100 text-green-800 text-xs font-bold px-3 py-1.5 rounded uppercase tracking-wider">Activo</div>
                                <div className="p-10">
                                    <div className="flex items-center mb-8">
                                        <i className="ph ph-bank text-5xl text-dairy-blue mr-4"></i>
                                        <h3 className="text-2xl font-bold text-gray-900">Transferencia / SPEI</h3>
                                    </div>
                                    <p className="text-base text-gray-600 mb-8 leading-relaxed">Realice su pago directamente a nuestra cuenta bancaria empresarial para liberar su pedido desde el CEDIS.</p>
                                    
                                    <div className="bg-gray-50 rounded-xl p-6 border border-gray-200 space-y-5">
                                        <div>
                                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Beneficiario Legal</p>
                                            <p className="font-bold text-gray-900 text-lg">PRODUCTOS Y SERVICIOS LACTEOS</p>
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Institución Bancaria</p>
                                            <p className="font-semibold text-dairy-blue text-lg">BANCO BBVA</p>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                            <div>
                                                <p className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Número de Cuenta</p>
                                                <p className="font-mono text-gray-800 font-bold text-lg">0117549121</p>
                                            </div>
                                            <button onClick={() => handleCopy('0117549121', 'Cuenta')} className="text-gray-400 hover:text-dairy-green bg-gray-100 p-2 rounded"><i className="ph ph-copy text-xl"></i></button>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                            <div>
                                                <p className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">CLABE Interbancaria (SPEI)</p>
                                                <p className="font-mono font-bold text-dairy-blue text-lg">012222001175491212</p>
                                            </div>
                                            <button onClick={() => handleCopy('012222001175491212', 'CLABE')} className="text-gray-400 hover:text-dairy-green bg-gray-100 p-2 rounded"><i className="ph ph-copy text-xl"></i></button>
                                        </div>
                                    </div>
                                    <p className="text-sm text-center text-gray-500 mt-8 font-medium">
                                        <i className="ph ph-warning-circle mr-1 text-yellow-500"></i> Favor de enviar su comprobante de pago por WhatsApp para agilizar el despacho.
                                    </p>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-xl border-t-8 border-dairy-green overflow-hidden relative flex flex-col">
                                <div className="absolute top-6 right-6 bg-green-100 text-green-800 text-xs font-bold px-3 py-1.5 rounded uppercase tracking-wider">Activo</div>
                                <div className="p-10 flex-grow flex flex-col">
                                    <div className="flex items-center mb-8">
                                        <i className="ph ph-credit-card text-5xl text-dairy-green mr-4"></i>
                                        <h3 className="text-2xl font-bold text-gray-900">Tarjeta de Crédito / Débito</h3>
                                    </div>
                                    <p className="text-base text-gray-600 mb-6 leading-relaxed">Pago en línea inmediato mediante Clip o PayPal. Ingresa el monto arriba y elige tu proveedor.</p>

                                    <div className="mt-auto space-y-4">
                                        <button onClick={() => pagarCon('clip')} disabled={pagando !== null} className="w-full bg-gray-900 text-white font-bold py-4 rounded-lg hover:bg-black transition flex justify-center items-center text-lg disabled:opacity-60">
                                            <i className="ph ph-lightning mr-2 text-2xl"></i> {pagando === 'clip' ? 'Generando link...' : 'Pagar con Clip'}
                                        </button>
                                        <button onClick={() => pagarCon('paypal')} disabled={pagando !== null} className="w-full bg-[#003087] text-white font-bold py-4 rounded-lg hover:bg-[#001c54] transition flex justify-center items-center text-lg disabled:opacity-60">
                                            <i className="ph ph-paypal-logo mr-2 text-2xl"></i> {pagando === 'paypal' ? 'Generando link...' : 'Pagar con PayPal'}
                                        </button>
                                    </div>
                                    <p className="text-xs text-center text-gray-400 mt-6">
                                        <i className="ph ph-shield-check mr-1"></i> Serás redirigido al sitio seguro del proveedor para completar el pago.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LeadModal = ({ closeModal, initialTab, showToast }) => {
            const [activeTab, setActiveTab] = useState(initialTab || 'cotizar');
            const [enviando, setEnviando] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setEnviando(true);
                const form = new FormData(e.target);
                const productos = form.getAll('productos').join(', ');
                const otro = form.get('otro') || '';

                try {
                    await enviarLead({
                        nombre: form.get('contacto'),
                        empresa: form.get('empresa'),
                        email: form.get('email'),
                        telefono: form.get('telefono'),
                        volumen: form.get('volumen'),
                        mensaje: `Frecuencia: ${form.get('frecuencia') || ''}. Productos de interés: ${productos || 'no especificado'}.${otro ? ' Otro: ' + otro : ''}`,
                        origen: activeTab === 'cotizar' ? 'Solicitud de Cotización' : 'Propuesta de Insumos'
                    });
                    closeModal();
                    const mensaje = activeTab === 'cotizar' 
                        ? "¡Solicitud de cotización enviada! Un asesor te contactará con los precios."
                        : "¡Sugerencia registrada! Tu feedback alimenta el crecimiento de nuestro catálogo.";
                    showToast(mensaje);
                } catch (err) {
                    showToast(`No se pudo enviar tu solicitud: ${err.message}`);
                } finally {
                    setEnviando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-gray-900/80 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden relative border-t-8 border-dairy-green my-8">
                        <button onClick={closeModal} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 transition z-10 bg-gray-100 rounded-full p-2">
                            <i className="ph ph-x text-2xl"></i>
                        </button>
                        
                        {/* Pestañas */}
                        <div className="flex bg-gray-50 border-b border-gray-200">
                            <button 
                                onClick={() => setActiveTab('cotizar')}
                                className={`flex-1 py-4 text-center font-bold text-lg border-b-4 transition ${activeTab === 'cotizar' ? 'border-dairy-green text-dairy-blue bg-white' : 'border-transparent text-gray-400 hover:text-gray-600'}`}
                            >
                                <i className="ph ph-shopping-cart mr-2"></i> Solicitar Cotización
                            </button>
                            <button 
                                onClick={() => setActiveTab('sugerir')}
                                className={`flex-1 py-4 text-center font-bold text-lg border-b-4 transition ${activeTab === 'sugerir' ? 'border-dairy-blue text-dairy-blue bg-white' : 'border-transparent text-gray-400 hover:text-gray-600'}`}
                            >
                                <i className="ph ph-lightbulb mr-2"></i> Proponer Insumos
                            </button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="p-8 space-y-6 text-sm">
                            {/* PESTAÑA COTIZAR */}
                            {activeTab === 'cotizar' && (
                                <div className="bg-blue-50 p-5 rounded-xl border border-blue-100">
                                    <label className="block font-bold text-dairy-blue mb-3 text-base">¿Qué deseas cotizar hoy? (Stock CEDIS León)</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-gray-700 font-medium">
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Leche Descremada (SMP)" className="w-5 h-5 rounded text-dairy-blue" /> <span>Leche Descremada (SMP)</span></label>
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Leche Entera (WMP)" className="w-5 h-5 rounded text-dairy-blue" /> <span>Leche Entera (WMP)</span></label>
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Suero Dulce de Leche" className="w-5 h-5 rounded text-dairy-blue" /> <span>Suero Dulce de Leche</span></label>
                                    </div>
                                </div>
                            )}

                            {/* PESTAÑA SUGERIR */}
                            {activeTab === 'sugerir' && (
                                <div className="bg-amber-50 p-5 rounded-xl border border-amber-100">
                                    <label className="block font-bold text-amber-900 mb-2 text-base">¿Qué insumos requieres a futuro?</label>
                                    <p className="text-amber-800 text-xs mb-4">Ayúdanos a armar nuestro catálogo para ti.</p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-gray-700 font-medium">
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Grasa Butírica (AMF)" className="w-5 h-5 rounded text-amber-600" /> <span>Grasa Butírica (AMF)</span></label>
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Lactosa Malla 100/200" className="w-5 h-5 rounded text-amber-600" /> <span>Lactosa Malla 100/200</span></label>
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Proteínas Lácteas (WPC)" className="w-5 h-5 rounded text-amber-600" /> <span>Proteínas Lácteas (WPC)</span></label>
                                        <label className="flex items-center space-x-3 cursor-pointer"><input type="checkbox" name="productos" value="Mantequilla Industrial" className="w-5 h-5 rounded text-amber-600" /> <span>Mantequilla Industrial</span></label>
                                    </div>
                                    <div className="mt-4">
                                        <input type="text" name="otro" placeholder="¿Otro? Especifica aquí..." className="w-full border border-amber-200 rounded p-2 focus:border-amber-400 outline-none bg-white" />
                                    </div>
                                </div>
                            )}

                            <div className="grid md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block font-bold text-gray-700 mb-2">Frecuencia de Compra</label>
                                    <select name="frecuencia" required className="w-full border border-gray-300 rounded-lg p-3 focus:border-dairy-blue outline-none bg-white">
                                        <option value="">Selecciona...</option><option>Spot (Única)</option><option>Semanal</option><option>Quincenal</option><option>Mensual</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-700 mb-2">Volumen Estimado por Pedido</label>
                                    <select name="volumen" required className="w-full border border-gray-300 rounded-lg p-3 focus:border-dairy-blue outline-none bg-white">
                                        <option value="">Selecciona...</option><option>Menos de 1 Tonelada</option><option>1 a 5 Ton (Medio Mayoreo)</option><option>5 a 20 Ton (Industrial)</option><option>Más de 20 Ton</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-6 pt-4 border-t border-gray-100">
                                <div>
                                    <label className="block font-bold text-gray-700 mb-2">Nombre de la Empresa</label>
                                    <input name="empresa" required type="text" placeholder="Razón Social o Marca" className="w-full border border-gray-300 rounded-lg p-3 focus:border-dairy-blue outline-none" />
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-700 mb-2">Nombre del Contacto</label>
                                    <input name="contacto" required type="text" placeholder="Ej. Juan Pérez" className="w-full border border-gray-300 rounded-lg p-3 focus:border-dairy-blue outline-none" />
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-700 mb-2">Correo Corporativo</label>
                                    <input name="email" required type="email" placeholder="correo@empresa.com" className="w-full border border-gray-300 rounded-lg p-3 focus:border-dairy-blue outline-none" />
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-700 mb-2">Teléfono / WhatsApp</label>
                                    <input name="telefono" required type="tel" placeholder="A 10 dígitos" className="w-full border border-gray-300 rounded-lg p-3 focus:border-dairy-blue outline-none" />
                                </div>
                            </div>

                            <button type="submit" disabled={enviando} className={`w-full text-white font-bold py-4 rounded-xl transition shadow-xl mt-4 flex justify-center items-center text-lg disabled:opacity-60 ${activeTab === 'cotizar' ? 'bg-dairy-green hover:bg-green-600' : 'bg-dairy-blue hover:bg-blue-900'}`}>
                                <i className="ph ph-paper-plane-tilt mr-2 text-2xl"></i> 
                                {enviando ? 'Enviando...' : (activeTab === 'cotizar' ? 'Enviar Solicitud a Ventas' : 'Enviar Propuesta al Observatorio')}
                            </button>
                            
                            <p className="text-xs text-center text-gray-400 font-medium mt-4">
                                <i className="ph ph-shield-check mr-1"></i> Tus datos están protegidos y serán registrados en nuestro sistema ERP.
                            </p>
                        </form>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
