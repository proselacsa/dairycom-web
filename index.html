<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAIRYCOM | Insumos Lácteos B2B | Grupo Proselacsa</title>
    
    <meta name="description" content="Plataforma inteligente B2B para la compra de insumos lácteos en México, respaldada por Grupo Proselacsa.">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dairy: { blue: '#0A2540', lightBlue: '#1D4ED8', green: '#00A859', gray: '#F3F4F6', accent: '#FBBF24' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #F9FAFB; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [toastMsg, setToastMsg] = useState('');
            const [modalConfig, setModalConfig] = useState({ isOpen: false, activeTab: 'cotizar' });
            const [exchangeRate, setExchangeRate] = useState('Cargando...');
            const [cartItem, setCartItem] = useState(null);
            
            // Estado para el menú móvil responsivo
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            useEffect(() => {
                fetch('https://open.er-api.com/v6/latest/USD')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.rates && data.rates.MXN) {
                            setExchangeRate(data.rates.MXN.toFixed(2));
                        }
                    })
                    .catch(() => setExchangeRate('18.50')); 
            }, []);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 4000);
            };

            const openModal = (tab) => {
                setModalConfig({ isOpen: true, activeTab: tab });
            };

            const initiateCheckout = (product) => {
                setCartItem(product);
                navigateTo('comprar');
                showToast(`Iniciando compra de: ${product.name}`);
            };

            // Función de navegación que cierra el menú móvil al hacer clic
            const navigateTo = (page) => {
                setCurrentPage(page);
                setIsMobileMenuOpen(false);
                window.scrollTo(0, 0);
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Navigation */}
                    <nav className="bg-dairy-blue text-white sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-20 items-center">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => navigateTo('home')}>
                                    <a href="https://www.proselacsa.com" target="_blank" title="Visitar Grupo Proselacsa" className="flex items-center hover:opacity-80 transition">
                                        <div className="w-14 h-11 bg-white/10 rounded-lg flex items-center justify-center p-1.5 border border-white/20 shadow-inner overflow-hidden">
                                            <img 
                                                src="./Logo Proselacsa Blanco.png" 
                                                alt="Proselacsa" 
                                                className="w-full h-full object-contain filter brightness-0 invert" 
                                                onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='block';}} 
                                            />
                                            <svg viewBox="0 0 100 100" className="w-full h-full fill-white" style={{display: 'none'}}>
                                                <path d="M15 20 C15 15, 20 15, 25 15 L75 15 C85 15, 90 20, 90 30 L90 70 C90 80, 85 85, 75 85 L25 85 C20 85, 15 80, 15 70 Z" fill="none" stroke="white" strokeWidth="8"/>
                                                <path d="M30 40 Q 50 25, 70 40 T 70 65 Q 50 80, 30 65 Z" fill="none" stroke="white" strokeWidth="6"/>
                                                <text x="35" y="62" fontFamily="sans-serif" fontWeight="bold" fontSize="36" fill="white">P</text>
                                            </svg>
                                        </div>
                                    </a>
                                    <div>
                                        <div className="text-2xl font-bold tracking-tighter">DAIRYCOM</div>
                                        <a href="https://www.proselacsa.com" target="_blank" className="text-[11px] text-blue-300 font-light hover:underline block">
                                            A member of Grupo Proselacsa
                                        </a>
                                    </div>
                                </div>
                                
                                {/* Desktop Menu */}
                                <div className="hidden lg:flex space-x-6 items-center font-medium text-sm">
                                    <button onClick={() => navigateTo('home')} className={`hover:text-dairy-green transition-colors ${currentPage==='home'?'text-dairy-green':''}`}>Inicio</button>
                                    <button onClick={() => navigateTo('nosotros')} className={`hover:text-dairy-green transition-colors ${currentPage==='nosotros'?'text-dairy-green':''}`}>Nosotros</button>
                                    <button onClick={() => navigateTo('productos')} className={`hover:text-dairy-green transition-colors ${currentPage==='productos'?'text-dairy-green':''}`}>Catálogo</button>
                                    <button onClick={() => navigateTo('mercado')} className={`hover:text-dairy-green transition-colors ${currentPage==='mercado'?'text-dairy-green':''}`}>Tendencias</button>
                                    <button onClick={() => navigateTo('academia')} className={`hover:text-dairy-green transition-colors ${currentPage==='academia'?'text-dairy-green':''}`}>Multimedia</button>
                                    <button onClick={() => navigateTo('envios')} className={`hover:text-dairy-green transition-colors ${currentPage==='envios'?'text-dairy-green':''}`}>Envíos</button>
                                    <button onClick={() => navigateTo('contacto')} className={`hover:text-dairy-green transition-colors ${currentPage==='contacto'?'text-dairy-green':''}`}>Contacto</button>
                                    <button onClick={() => navigateTo('comprar')} className="bg-dairy-green text-white px-5 py-2 rounded shadow hover:bg-green-600 transition flex items-center">
                                        <i className="ph ph-shopping-cart mr-2 text-lg"></i> Checkout
                                        {cartItem && <span className="ml-2 bg-white text-dairy-green text-[10px] px-1.5 py-0.5 rounded-full font-bold">1</span>}
                                    </button>
                                </div>

                                {/* Mobile Menu Button */}
                                <div className="lg:hidden flex items-center">
                                    <button className="text-white p-2 focus:outline-none" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                        <i className={`ph ${isMobileMenuOpen ? 'ph-x' : 'ph-list'} text-3xl`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Dropdown Menu (Responsivo) */}
                        {isMobileMenuOpen && (
                            <div className="lg:hidden bg-gray-900 border-t border-gray-800 shadow-xl fade-in absolute w-full left-0 z-50">
                                <div className="px-4 pt-2 pb-6 space-y-2">
                                    <button onClick={() => navigateTo('home')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Inicio</button>
                                    <button onClick={() => navigateTo('nosotros')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Nosotros</button>
                                    <button onClick={() => navigateTo('productos')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Catálogo</button>
                                    <button onClick={() => navigateTo('mercado')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Tendencias</button>
                                    <button onClick={() => navigateTo('academia')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Multimedia</button>
                                    <button onClick={() => navigateTo('envios')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Envíos</button>
                                    <button onClick={() => navigateTo('contacto')} className="block w-full text-left px-3 py-3 font-medium text-white hover:bg-gray-800 rounded">Contacto</button>
                                    <button onClick={() => navigateTo('comprar')} className="block w-full text-left px-3 py-3 font-bold text-dairy-green bg-gray-800 rounded flex items-center mt-2">
                                        <i className="ph ph-shopping-cart mr-2 text-xl"></i> Ir al Checkout {cartItem && '(1)'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </nav>

                    {/* Main Content */}
                    <main className="flex-grow">
                        {currentPage === 'home' && <Home setCurrentPage={navigateTo} openModal={openModal} exchangeRate={exchangeRate} />}
                        {currentPage === 'nosotros' && <Nosotros />}
                        {currentPage === 'productos' && <Productos openModal={openModal} initiateCheckout={initiateCheckout} />}
                        {currentPage === 'mercado' && <Observatorio exchangeRate={exchangeRate} />}
                        {currentPage === 'academia' && <Academia />}
                        {currentPage === 'envios' && <Envios showToast={showToast} />}
                        {currentPage === 'contacto' && <Contacto showToast={showToast} />}
                        {currentPage === 'comprar' && <Comprar showToast={showToast} cartItem={cartItem} exchangeRate={exchangeRate} />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-300 py-12">
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div>
                                <h3 className="text-white text-xl font-bold mb-4">DAIRYCOM</h3>
                                <p className="text-sm text-gray-400">Plataforma digital para la comercialización de insumos lácteos a menudeo y medio mayoreo, respaldada por Grupo PROSELACSA.</p>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Secciones</h4>
                                <ul className="space-y-2 text-sm text-gray-400">
                                    <li><button onClick={()=>navigateTo('nosotros')} className="hover:text-white">Nuestra Historia</button></li>
                                    <li><button onClick={()=>navigateTo('productos')} className="hover:text-white">Catálogo de Productos</button></li>
                                    <li><button onClick={()=>navigateTo('mercado')} className="hover:text-white">Observatorio de Precios</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Contacto</h4>
                                <ul className="space-y-3 text-sm text-gray-400">
                                    <li className="flex items-start"><i className="ph ph-map-pin mr-2 text-lg text-dairy-green"></i> <span>León, Guanajuato, México.<br/>Corredor Industrial del Bajío.</span></li>
                                    <li className="flex items-center"><i className="ph ph-envelope mr-2 text-lg text-dairy-green"></i> ventas@proselacsa.com</li>
                                    <li className="flex items-center"><i className="ph ph-phone mr-2 text-lg text-dairy-green"></i> 479 104 5539</li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Corporativo</h4>
                                <ul className="space-y-2 text-sm text-gray-400">
                                    <li><a href="https://www.proselacsa.com" target="_blank" className="hover:text-white flex items-center"><i className="ph ph-globe mr-2"></i> www.proselacsa.com</a></li>
                                </ul>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 mt-8 pt-8 border-t border-gray-800 text-sm text-gray-500 text-center">
                            © 2026 DAIRYCOM - Grupo PROSELACSA. Todos los derechos reservados.
                        </div>
                    </footer>

                    {/* Botón Flotante WhatsApp */}
                    <a href="https://wa.me/524791045539?text=Hola,%20quiero%20información%20sobre%20insumos%20lácteos" target="_blank" className="fixed bottom-6 right-6 bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:bg-[#128C7E] transition-all z-50 flex items-center group cursor-pointer border-2 border-white ring-4 ring-[#25D366]/50 animate-bounce">
                        <i className="ph ph-whatsapp text-4xl"></i>
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 ease-in-out whitespace-nowrap group-hover:ml-3 font-bold text-base">
                            Hablar con un especialista
                        </span>
                    </a>

                    {/* Modal Dual Controlado */}
                    {modalConfig.isOpen && <LeadModal closeModal={() => setModalConfig({ ...modalConfig, isOpen: false })} initialTab={modalConfig.activeTab} showToast={showToast} />}
                    
                    {toastMsg && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-2xl z-50 fade-in flex items-center border border-gray-700 w-11/12 max-w-sm sm:max-w-md text-sm">
                            <i className="ph ph-info mr-3 text-dairy-accent text-2xl"></i> {toastMsg}
                        </div>
                    )}
                </div>
            );
        };

        /* ==================== COMPONENTES DE PÁGINA ==================== */

        const Home = ({ setCurrentPage, openModal, exchangeRate }) => (
            <div className="fade-in">
                {/* Ticker Superior con Tipo de Cambio Real */}
                <div className="bg-gray-900 text-blue-200 text-xs py-2 px-4 border-b border-gray-800 overflow-x-auto whitespace-nowrap">
                    <div className="max-w-7xl mx-auto flex space-x-8 items-center min-w-max">
                        <span className="flex items-center"><i className="ph ph-pulse text-dairy-green mr-1.5 animate-pulse"></i> <strong>GDT Index:</strong> 3,979 USD/MT</span>
                        <span className="flex items-center"><i className="ph ph-chart-line-up text-dairy-accent mr-1.5"></i> <strong>CME Block Cheese:</strong> $70.00 MXN/kg</span>
                        <span className="flex items-center text-green-400"><i className="ph ph-currency-circle-dollar mr-1.5"></i> <strong>USD/MXN:</strong> ${exchangeRate} (API)</span>
                        <span className="flex items-center"><i className="ph ph-factory text-blue-400 mr-1.5"></i> <strong>CEDIS León:</strong> Normal</span>
                    </div>
                </div>

                {/* Hero Institucional */}
                <div className="bg-dairy-blue text-white relative overflow-hidden">
                    <div className="absolute inset-0 opacity-25 bg-[url('https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-dairy-blue via-dairy-blue/95 to-dairy-blue/70"></div>
                    
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-32 relative z-10">
                        <div className="md:w-4/5">
                            <div className="inline-flex items-center space-x-2 bg-dairy-green/20 border border-dairy-green/40 text-dairy-green px-3.5 py-1.5 rounded-full text-xs font-semibold mb-6">
                                <i className="ph ph-lightning text-sm"></i>
                                <span>Plataforma Inteligente B2B</span>
                            </div>
                            
                            <h1 className="text-4xl md:text-6xl font-extrabold leading-tight mb-6 tracking-tight">
                                La Inteligencia y el Suministro Confiable de Insumos Lácteos en México
                            </h1>
                            
                            <p className="text-base md:text-xl font-light mb-10 text-gray-300 leading-relaxed">
                                Compra leche en polvo, sueros y grasas lácteas a menudeo y medio mayoreo con disponibilidad inmediata desde nuestro CEDIS en León, Gto. 
                            </p>
                            
                            <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mb-12">
                                <button onClick={() => setCurrentPage('productos')} className="w-full sm:w-auto bg-dairy-green text-white px-6 py-4 rounded-lg font-bold hover:bg-green-600 transition shadow-lg flex items-center justify-center text-base sm:text-lg border-2 border-dairy-green">
                                    <i className="ph ph-shopping-bag mr-2 text-2xl"></i> Ver Inventario y Comprar
                                </button>
                                <button onClick={() => openModal('sugerir')} className="w-full sm:w-auto bg-transparent border-2 border-white text-white px-6 py-4 rounded-lg font-bold hover:bg-white hover:text-dairy-blue transition shadow-lg flex items-center justify-center text-base sm:text-lg">
                                    <i className="ph ph-lightbulb mr-2 text-2xl"></i> Proponer Nuevos Insumos
                                </button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-8 border-t border-blue-900/60">
                                <div className="flex items-center space-x-3">
                                    <i className="ph ph-shield-check text-2xl text-dairy-green"></i>
                                    <span className="text-xs text-gray-300 font-medium">Insumos Grado Alimenticio</span>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <i className="ph ph-map-pin text-2xl text-dairy-accent"></i>
                                    <span className="text-xs text-gray-300 font-medium">CEDIS Estratégico en León</span>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <i className="ph ph-cpu text-2xl text-blue-400"></i>
                                    <span className="text-xs text-gray-300 font-medium">Conexión Odoo ERP</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Quick Navigation Cards */}
                <div className="bg-white py-12 border-b border-gray-200">
                    <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 text-center">
                        <div className="p-6 cursor-pointer group rounded-xl bg-gray-50 border border-gray-100 hover:shadow-lg transition" onClick={() => setCurrentPage('mercado')}>
                            <i className="ph ph-trend-up text-4xl text-dairy-blue mb-2 group-hover:text-dairy-green transition"></i>
                            <h3 className="font-semibold text-gray-800">Precios de Mercado</h3>
                            <p className="text-xs text-gray-500 mt-1">GDT & CME</p>
                        </div>
                        <div className="p-6 cursor-pointer group rounded-xl bg-gray-50 border border-gray-100 hover:shadow-lg transition" onClick={() => setCurrentPage('envios')}>
                            <i className="ph ph-truck text-4xl text-dairy-blue mb-2 group-hover:text-dairy-green transition"></i>
                            <h3 className="font-semibold text-gray-800">Cotizar Envíos</h3>
                            <p className="text-xs text-gray-500 mt-1">Logística especializada</p>
                        </div>
                        <div className="p-6 cursor-pointer group rounded-xl bg-gray-50 border border-gray-100 hover:shadow-lg transition" onClick={() => setCurrentPage('academia')}>
                            <i className="ph ph-youtube-logo text-4xl text-dairy-blue mb-2 group-hover:text-red-600 transition"></i>
                            <h3 className="font-semibold text-gray-800">Academia Láctea</h3>
                            <p className="text-xs text-gray-500 mt-1">Aplicaciones Técnicas</p>
                        </div>
                        <div className="p-6 cursor-pointer group rounded-xl bg-gray-50 border border-gray-100 hover:shadow-lg transition" onClick={() => setCurrentPage('contacto')}>
                            <i className="ph ph-headset text-4xl text-dairy-blue mb-2 group-hover:text-dairy-green transition"></i>
                            <h3 className="font-semibold text-gray-800">Asesoría Técnica</h3>
                            <p className="text-xs text-gray-500 mt-1">Ingenieros de alimentos</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Nosotros = () => (
            <div className="py-16 bg-white max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 fade-in">
                <div className="text-center mb-12 sm:mb-16">
                    <h2 className="text-3xl md:text-5xl font-bold text-dairy-blue mb-4">El Respaldo de un Líder</h2>
                    <p className="text-base sm:text-xl text-gray-600 max-w-3xl mx-auto">Conoce cómo DAIRYCOM se integra al ecosistema de Grupo PROSELACSA para garantizar tu suministro.</p>
                </div>

                <div className="grid md:grid-cols-2 gap-10 sm:gap-16 items-start mb-16">
                    <div>
                        <h3 className="text-2xl font-bold text-gray-800 mb-4">Evolución y Respaldo Corporativo</h3>
                        <p className="text-gray-600 mb-6 leading-relaxed">
                            Grupo Proselacsa cuenta con una trayectoria consolidada a través de sus unidades originales: <strong>Comercio Industrial y Logística</strong>. Hoy, frente a la evolución del mercado y la necesidad de abastecimiento ágil, nace nuestra nueva <strong>División Comercial Digital: DAIRYCOM</strong>.
                        </p>
                        
                        <a href="./Brochure_Proselacsa.pdf" download="Brochure_Proselacsa.pdf" className="inline-flex w-full sm:w-auto justify-center items-center bg-dairy-blue text-white px-6 py-3 rounded-lg hover:bg-blue-900 transition font-bold shadow-md mb-8">
                            <i className="ph ph-download-simple mr-2 text-xl"></i> Descargar Brochure
                        </a>

                        <div className="space-y-4">
                            <div className="flex">
                                <i className="ph ph-target text-dairy-green text-2xl mr-4 mt-1"></i>
                                <div>
                                    <h4 className="font-bold text-gray-800">Misión</h4>
                                    <p className="text-gray-600 text-sm">Proveer insumos lácteos de grado internacional con disponibilidad inmediata, optimizando los costos de producción a menudeo y medio mayoreo.</p>
                                </div>
                            </div>
                            <div className="flex">
                                <i className="ph ph-eye text-dairy-green text-2xl mr-4 mt-1"></i>
                                <div>
                                    <h4 className="font-bold text-gray-800">Visión</h4>
                                    <p className="text-gray-600 text-sm">Ser la plataforma digital B2B líder en inteligencia de mercado y suministro de sólidos lácteos en México.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-gray-50 p-6 sm:p-8 rounded-xl border border-gray-200 shadow-inner">
                        <h4 className="text-center font-bold text-gray-500 mb-8 uppercase tracking-widest text-sm">Ecosistema Grupo Proselacsa</h4>
                        <div className="flex flex-col items-center space-y-4">
                            <a href="https://www.proselacsa.com" target="_blank" className="bg-dairy-blue text-white w-full py-4 rounded-lg text-center font-bold shadow-md hover:bg-blue-900 transition block">
                                Grupo PROSELACSA
                            </a>
                            <i className="ph ph-arrow-down text-gray-400 text-2xl"></i>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                                <a href="https://www.proselacsa.com/index.php?vw=1440&vh=731&v0=&v1=188&v1b=0&v2=esp&v3=0&v4=despliega&v5=despliega&v6=despliega&v10=0&v13=&v14=&v25=1805&v26=0" target="_blank" className="bg-white border-2 border-blue-200 text-dairy-blue py-6 px-4 rounded-lg text-center shadow-sm hover:bg-blue-50 transition cursor-pointer block">
                                    <i className="ph ph-truck text-3xl mb-2"></i><br/>Proselacsa Logística
                                </a>
                                <div className="bg-white border-2 border-green-200 text-dairy-green py-6 px-4 rounded-lg text-center shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 right-0 bg-dairy-green text-white text-[10px] px-2 py-1 rounded-bl">Digital</div>

                        </div>

                        <div className="bg-gray-50 p-6 sm:p-10 rounded-2xl border border-gray-200 shadow-lg">
                            <h3 className="text-xl sm:text-2xl font-bold text-gray-800 mb-6">Envíanos un mensaje</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><input required type="text" placeholder="Nombre o Empresa" className="w-full border border-gray-300 p-3 rounded-lg outline-none focus:border-dairy-blue text-sm sm:text-base" /></div>
                                <div><input required type="email" placeholder="Correo Corporativo" className="w-full border border-gray-300 p-3 rounded-lg outline-none focus:border-dairy-blue text-sm sm:text-base" /></div>
                                <div><input required type="tel" placeholder="Teléfono" className="w-full border border-gray-300 p-3 rounded-lg outline-none focus:border-dairy-blue text-sm sm:text-base" /></div>
                                <div><textarea required rows="4" placeholder="Requerimiento" className="w-full border border-gray-300 p-3 rounded-lg outline-none resize-none focus:border-dairy-blue text-sm sm:text-base"></textarea></div>
                                <button type="submit" className="w-full bg-dairy-green text-white font-bold py-3 sm:py-4 rounded-lg hover:bg-green-600 transition text-base sm:text-lg shadow">
                                    Enviar Consulta
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        /* SECCIÓN CHECKOUT B2B (Totalmente Responsiva) */
        const Comprar = ({ showToast, cartItem, exchangeRate }) => {
            const handleCopy = (text, type) => {
                navigator.clipboard.writeText(text);
                showToast(`${type} copiada al portapapeles`);
            };

            const isNumericRate = !isNaN(parseFloat(exchangeRate));
            const exchangeVal = isNumericRate ? parseFloat(exchangeRate) : 18.50;
            const precioSacoUSD = 83.75; 
            const precioSacoMXN = (precioSacoUSD * exchangeVal).toFixed(2);

            return (
                <div className="py-8 sm:py-12 bg-gray-50 fade-in min-h-screen">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="mb-6 sm:mb-8">
                            <h2 className="text-2xl sm:text-3xl font-bold text-dairy-blue">Checkout B2B</h2>
                            <p className="text-sm sm:text-base text-gray-600 mt-1">Completa tu pago seguro para liberar el inventario en CEDIS León.</p>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 sm:gap-8 flex-col-reverse md:flex-row">
                            
                            {/* Pasarelas de Pago (Lado izquierdo o arriba en móvil) */}
                            <div className="md:col-span-2 space-y-6 order-2 md:order-1">
                                {/* CLIP */}
                                <div className="bg-white rounded-xl shadow-md border-t-4 border-[#FF6B00] p-5 sm:p-6 relative overflow-hidden">
                                    <div className="absolute top-4 right-4 bg-gray-100 text-gray-500 text-[9px] sm:text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Próximamente</div>
                                    <div className="flex items-center mb-3">
                                        <div className="bg-[#FF6B00] text-white px-2 py-1 rounded mr-3 font-bold italic tracking-tighter text-sm">Clip</div>
                                        <h3 className="font-bold text-gray-800 text-base sm:text-lg">Tarjeta Crédito/Débito</h3>
                                    </div>
                                    <p className="text-xs sm:text-sm text-gray-500 mb-4 sm:mb-6">Integración de Clip Checkout para la Etapa 2.</p>
                                    <button disabled className="w-full bg-gray-100 text-gray-400 font-bold py-3 sm:py-4 rounded-lg cursor-not-allowed border border-gray-200 text-sm sm:text-base">
                                        Integración en proceso...
                                    </button>
                                </div>

                                {/* PAYPAL */}
                                <div className="bg-white rounded-xl shadow-md border-t-4 border-[#003087] p-5 sm:p-6 relative overflow-hidden">
                                    <div className="absolute top-4 right-4 bg-gray-100 text-gray-500 text-[9px] sm:text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Próximamente</div>
                                    <div className="flex items-center mb-3">
                                        <i className="ph ph-paypal-logo text-2xl sm:text-3xl text-[#003087] mr-3"></i>
                                        <h3 className="font-bold text-gray-800 text-base sm:text-lg">Pago con PayPal</h3>
                                    </div>
                                    <p className="text-xs sm:text-sm text-gray-500 mb-4 sm:mb-6">API de PayPal Checkout para la Etapa 2.</p>
                                    <button disabled className="w-full bg-[#FFC439] text-[#003087] font-bold py-3 sm:py-4 rounded-lg cursor-not-allowed opacity-50 text-sm sm:text-base">
                                        Integración en proceso...
                                    </button>
                                </div>

                                {/* SPEI */}
                                <div className="bg-white rounded-xl shadow-md border-t-4 border-dairy-blue p-5 sm:p-6">
                                    <div className="flex items-center mb-4">
                                        <i className="ph ph-bank text-2xl sm:text-3xl text-dairy-blue mr-3"></i>
                                        <h3 className="font-bold text-gray-800 text-base sm:text-lg">Transferencia (SPEI)</h3>
                                    </div>
                                    <p className="text-xs sm:text-sm text-gray-600 mb-4 sm:mb-6">Realiza el depósito directamente para liberar la orden.</p>
                                    
                                    <div className="bg-gray-50 rounded-lg p-4 border border-gray-200 space-y-4">
                                        <div>
                                            <p className="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Beneficiario Legal</p>
                                            <p className="font-bold text-gray-900 text-xs sm:text-sm">PRODUCTOS Y SERVICIOS LACTEOS DE CV</p>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <p className="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Banco</p>
                                                <p className="font-semibold text-dairy-blue text-xs sm:text-sm">BBVA</p>
                                            </div>
                                            <div>
                                                <p className="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Cuenta</p>
                                                <div className="flex items-center">
                                                    <p className="font-mono text-gray-800 text-sm mr-2">0117549121</p>
                                                    <button onClick={() => handleCopy('0117549121', 'Cuenta')} className="text-dairy-green p-1 bg-green-50 rounded"><i className="ph ph-copy"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="pt-2 border-t border-gray-200">
                                            <p className="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">CLABE Interbancaria</p>
                                            <div className="flex items-center justify-between bg-white border border-gray-100 p-2 rounded">
                                                <p className="font-mono font-bold text-dairy-blue text-sm sm:text-base overflow-x-auto">012222001175491212</p>
                                                <button onClick={() => handleCopy('012222001175491212', 'CLABE')} className="text-dairy-green bg-green-50 px-2 sm:px-3 py-1.5 rounded text-xs ml-2 flex-shrink-0"><i className="ph ph-copy mr-1"></i> Copiar</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Resumen del Carrito (Lado derecho o abajo en móvil) */}
                            <div className="md:col-span-1 order-1 md:order-2">
                                <div className="bg-white rounded-xl shadow-md border border-gray-200 p-5 sm:p-6 sticky top-24">
                                    <h3 className="font-bold text-base sm:text-lg border-b pb-3 mb-4 text-gray-800">Resumen de la Orden</h3>
                                    
                                    {cartItem ? (
                                        <div className="flex items-center mb-5 sm:mb-6">
                                            <div className="w-12 h-12 sm:w-16 sm:h-16 bg-gray-100 rounded mr-3 sm:mr-4 flex items-center justify-center p-1.5 sm:p-2 flex-shrink-0">
                                                <img src={cartItem.image} alt="Saco" className="max-w-full max-h-full object-contain" />
                                            </div>
                                            <div>
                                                <p className="font-bold text-xs sm:text-sm text-dairy-blue leading-tight">{cartItem.name}</p>
                                                <p className="text-[10px] sm:text-xs text-gray-500 mt-1">Saco 25 kg | {cartItem.brand}</p>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-xs sm:text-sm text-gray-500 mb-6 italic">No hay productos seleccionados. Vuelve al catálogo.</div>
                                    )}

                                    <div className="space-y-2 sm:space-y-3 text-xs sm:text-sm text-gray-600 border-b pb-4 mb-4">
                                        <div className="flex justify-between"><span>Subtotal (USD)</span><span className="font-mono">${cartItem ? precioSacoUSD.toFixed(2) : '0.00'}</span></div>
                                        <div className="flex justify-between"><span>Tipo de Cambio</span><span className="font-mono">${exchangeVal.toFixed(2)}</span></div>
                                    </div>
                                    
                                    <div className="flex justify-between items-center text-base sm:text-lg font-bold text-gray-900 mb-1">
                                        <span>Total (MXN)</span>
                                        <span className="text-dairy-green font-mono">${cartItem ? precioSacoMXN : '0.00'}</span>
                                    </div>
                                    <p className="text-[9px] sm:text-[10px] text-gray-400 text-right uppercase tracking-wider">No incluye envío</p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        /* MODAL DUAL DE LEADS (Responsivo) */
        const LeadModal = ({ closeModal, initialTab, showToast }) => {
            const [activeTab, setActiveTab] = useState(initialTab || 'cotizar');

            const handleSubmit = async (e) => {
                e.preventDefault();
                closeModal();
                
                // NOTA TÉCNICA: En la Etapa 1.5 esto es una simulación visual. 
                // En la Etapa 2 reemplazaremos este código por la petición real al servidor Python:
                // const response = await fetch('https://dairycom-api.onrender.com/api/leads', {', { ... })
                
                showToast(activeTab === 'cotizar' ? "¡Cotización enviada a ventas!" : "¡Sugerencia registrada!");
            };

            return (
                <div className="fixed inset-0 bg-gray-900/80 flex items-end sm:items-center justify-center z-[100] sm:p-4 fade-in backdrop-blur-sm overflow-y-auto">
                    <div className="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden relative border-t-8 border-dairy-green sm:my-8 max-h-[90vh] sm:max-h-none overflow-y-auto">
                        
                        <button onClick={closeModal} className="absolute top-3 right-3 sm:top-4 sm:right-4 text-gray-400 hover:text-gray-800 transition z-10 bg-gray-100 rounded-full p-2">
                            <i className="ph ph-x text-xl sm:text-2xl"></i>
                        </button>
                        
                        <div className="flex bg-gray-50 border-b border-gray-200 mt-2 sm:mt-0 pr-12 sm:pr-0">
                            <button onClick={() => setActiveTab('cotizar')} className={`flex-1 py-3 sm:py-4 text-center font-bold text-sm sm:text-lg border-b-4 transition ${activeTab === 'cotizar' ? 'border-dairy-green text-dairy-blue bg-white' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                                <i className="ph ph-shopping-cart mr-1 sm:mr-2"></i> Cotizar
                            </button>
                            <button onClick={() => setActiveTab('sugerir')} className={`flex-1 py-3 sm:py-4 text-center font-bold text-sm sm:text-lg border-b-4 transition ${activeTab === 'sugerir' ? 'border-dairy-blue text-dairy-blue bg-white' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                                <i className="ph ph-lightbulb mr-1 sm:mr-2"></i> Sugerir
                            </button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="p-5 sm:p-8 space-y-5 sm:space-y-6 text-sm">
                            {activeTab === 'cotizar' && (
                                <div className="bg-blue-50 p-4 sm:p-5 rounded-xl border border-blue-100">
                                    <label className="block font-bold text-dairy-blue mb-2 text-sm sm:text-base">Insumos (Stock CEDIS León)</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-gray-700 font-medium text-xs sm:text-sm">
                                        <label className="flex items-center space-x-2"><input type="checkbox" className="w-4 h-4 rounded text-dairy-blue" /> <span>Leche Descremada (SMP)</span></label>
                                        <label className="flex items-center space-x-2"><input type="checkbox" className="w-4 h-4 rounded text-dairy-blue" /> <span>Leche Entera (WMP)</span></label>
                                        <label className="flex items-center space-x-2"><input type="checkbox" className="w-4 h-4 rounded text-dairy-blue" /> <span>Suero Dulce de Leche</span></label>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'sugerir' && (
                                <div className="bg-amber-50 p-4 sm:p-5 rounded-xl border border-amber-100">
                                    <label className="block font-bold text-amber-900 mb-1 text-sm sm:text-base">Insumos a futuro</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-gray-700 font-medium text-xs sm:text-sm mt-3">
                                        <label className="flex items-center space-x-2"><input type="checkbox" className="w-4 h-4 rounded text-amber-600" /> <span>Grasa Butírica (AMF)</span></label>
                                        <label className="flex items-center space-x-2"><input type="checkbox" className="w-4 h-4 rounded text-amber-600" /> <span>Lactosa Malla 100/200</span></label>
                                        <label className="flex items-center space-x-2"><input type="checkbox" className="w-4 h-4 rounded text-amber-600" /> <span>Proteínas Lácteas (WPC)</span></label>
                                    </div>
                                    <input type="text" placeholder="¿Otro? Especifica aquí..." className="mt-3 w-full border border-amber-200 rounded p-2 focus:border-amber-400 outline-none bg-white text-xs sm:text-sm" />
                                </div>
                            )}

                            <div className="grid grid-cols-2 gap-4 sm:gap-6">
                                <div>
                                    <label className="block font-bold text-gray-700 mb-1 sm:mb-2 text-xs sm:text-sm">Frecuencia</label>
                                    <select required className="w-full border border-gray-300 rounded-lg p-2 sm:p-3 outline-none text-xs sm:text-sm"><option value="">Selecciona...</option><option>Spot</option><option>Mensual</option></select>
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-700 mb-1 sm:mb-2 text-xs sm:text-sm">Volumen Mensual</label>
                                    <select required className="w-full border border-gray-300 rounded-lg p-2 sm:p-3 outline-none text-xs sm:text-sm"><option value="">Selecciona...</option><option>Menos de 1 Ton</option><option>1 a 5 Ton</option><option>Más de 5 Ton</option></select>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 pt-3 border-t border-gray-100">
                                <div><input required type="text" placeholder="Empresa" className="w-full border border-gray-300 rounded-lg p-2.5 sm:p-3 outline-none text-xs sm:text-sm" /></div>
                                <div><input required type="text" placeholder="Contacto" className="w-full border border-gray-300 rounded-lg p-2.5 sm:p-3 outline-none text-xs sm:text-sm" /></div>
                                <div><input required type="email" placeholder="Correo" className="w-full border border-gray-300 rounded-lg p-2.5 sm:p-3 outline-none text-xs sm:text-sm" /></div>
                                <div><input required type="tel" placeholder="Teléfono" className="w-full border border-gray-300 rounded-lg p-2.5 sm:p-3 outline-none text-xs sm:text-sm" /></div>
                            </div>

                            <button type="submit" className={`w-full text-white font-bold py-3 sm:py-4 rounded-xl shadow-md mt-2 flex justify-center items-center text-sm sm:text-lg ${activeTab === 'cotizar' ? 'bg-dairy-green' : 'bg-dairy-blue'}`}>
                                <i className="ph ph-paper-plane-tilt mr-2 text-lg sm:text-xl"></i> Enviar Datos
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
