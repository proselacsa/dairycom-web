<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAIRYCOM | Insumos Lácteos B2B | Grupo Proselacsa</title>
    
    <meta name="description" content="Plataforma inteligente B2B para la compra de insumos lácteos en México, respaldada por Grupo Proselacsa.">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dairy: { blue: '#0A2540', lightBlue: '#1D4ED8', green: '#00A859', gray: '#F3F4F6', accent: '#FBBF24' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #F9FAFB; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE_URL = "https://dairycom-api.onrender.com"; 

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [toastMsg, setToastMsg] = useState('');
            const [modalConfig, setModalConfig] = useState({ isOpen: false, activeTab: 'cotizar' });

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 4000);
            };

            const openModal = (tab) => {
                setModalConfig({ isOpen: true, activeTab: tab });
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Navigation */}
                    <nav className="bg-dairy-blue text-white sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-20 items-center">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentPage('home')}>
                                    <a href="https://www.proselacsa.com" target="_blank" title="Visitar Grupo Proselacsa" className="flex items-center hover:opacity-80 transition">
                                        <div className="w-14 h-11 bg-white/10 rounded-lg flex items-center justify-center p-1.5 border border-white/20 shadow-inner overflow-hidden">
                                            <img 
                                                src="./Logo Proselacsa Blanco.png" 
                                                alt="Proselacsa" 
                                                className="w-full h-full object-contain filter brightness-0 invert" 
                                                onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='block';}} 
                                            />
                                            <svg viewBox="0 0 100 100" className="w-full h-full fill-white" style={{display: 'none'}}>
                                                <path d="M15 20 C15 15, 20 15, 25 15 L75 15 C85 15, 90 20, 90 30 L90 70 C90 80, 85 85, 75 85 L25 85 C20 85, 15 80, 15 70 Z" fill="none" stroke="white" strokeWidth="8"/>
                                                <path d="M30 40 Q 50 25, 70 40 T 70 65 Q 50 80, 30 65 Z" fill="none" stroke="white" strokeWidth="6"/>
                                                <text x="35" y="62" fontFamily="sans-serif" fontWeight="bold" fontSize="36" fill="white">P</text>
                                            </svg>
                                        </div>
                                    </a>
                                    <div>
                                        <div className="text-2xl font-bold tracking-tighter">DAIRYCOM</div>
                                        <a href="https://www.proselacsa.com" target="_blank" className="text-[11px] text-blue-300 font-light hover:underline block">
                                            A member of Grupo Proselacsa
                                        </a>
                                    </div>
                                </div>
                                
                                {/* Desktop Menu */}
                                <div className="hidden lg:flex space-x-6 items-center font-medium text-sm">
                                    <button onClick={() => setCurrentPage('home')} className={`hover:text-dairy-green transition-colors ${currentPage==='home'?'text-dairy-green':''}`}>Inicio</button>
                                    <button onClick={() => setCurrentPage('productos')} className={`hover:text-dairy-green transition-colors ${currentPage==='productos'?'text-dairy-green':''}`}>Catálogo</button>
                                    <button onClick={() => openModal('cotizar')} className="bg-dairy-green text-white px-5 py-2 rounded shadow hover:bg-green-600 transition flex items-center">
                                        <i className="ph ph-shopping-cart mr-2 text-lg"></i> Comprar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-grow">
                        {currentPage === 'home' && <Home setCurrentPage={setCurrentPage} openModal={openModal} />}
                        {currentPage === 'productos' && <Productos openModal={openModal} setCurrentPage={setCurrentPage} />}
                        {currentPage === 'comprar' && <Comprar showToast={showToast} />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-300 py-12">
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div>
                                <h3 className="text-white text-xl font-bold mb-4">DAIRYCOM</h3>
                                <p className="text-sm text-gray-400">Plataforma digital para la comercialización de insumos lácteos a menudeo y medio mayoreo, respaldada por Grupo PROSELACSA.</p>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Contacto</h4>
                                <ul className="space-y-3 text-sm text-gray-400">
                                    <li className="flex items-start"><i className="ph ph-map-pin mr-2 text-lg text-dairy-green"></i> <span>León, Guanajuato, México.<br/>Corredor Industrial del Bajío.</span></li>
                                    <li className="flex items-center"><i className="ph ph-envelope mr-2 text-lg text-dairy-green"></i> ventas@proselacsa.com</li>
                                    <li className="flex items-center"><i className="ph ph-phone mr-2 text-lg text-dairy-green"></i> 479 104 5539</li>
                                </ul>
                            </div>
                        </div>
                    </footer>

                    {/* Botón Flotante WhatsApp */}
                    <a href="https://wa.me/524791045539?text=Hola,%20quiero%20información%20sobre%20insumos%20lácteos" target="_blank" className="fixed bottom-6 right-6 bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:bg-[#128C7E] transition-all z-50 flex items-center group cursor-pointer border-2 border-white ring-4 ring-[#25D366]/50 animate-bounce">
                        <i className="ph ph-whatsapp text-4xl"></i>
                    </a>

                    {modalConfig.isOpen && <LeadModal closeModal={() => setModalConfig({ ...modalConfig, isOpen: false })} initialTab={modalConfig.activeTab} showToast={showToast} />}
                    
                    {toastMsg && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-2xl z-50 fade-in flex items-center border border-gray-700">
                            <i className="ph ph-info mr-3 text-dairy-accent text-xl"></i> {toastMsg}
                        </div>
                    )}
                </div>
            );
        };

        const Home = ({ setCurrentPage, openModal }) => (
            <div className="fade-in">
                {/* Ticker Superior */}
                <div className="bg-gray-900 text-blue-200 text-xs py-2 px-4 border-b border-gray-800 overflow-x-auto whitespace-nowrap">
                    <div className="max-w-7xl mx-auto flex justify-between items-center space-x-8">
                        <span className="flex items-center"><i className="ph ph-pulse text-dairy-green mr-1.5 animate-pulse"></i> <strong>GDT Index:</strong> Estable</span>
                        <span className="flex items-center text-green-400"><i className="ph ph-currency-circle-dollar mr-1.5"></i> <strong>Cotización:</strong> MXN (Pesos)</span>
                        <span className="flex items-center"><i className="ph ph-factory text-blue-400 mr-1.5"></i> <strong>CEDIS León:</strong> Operando con normalidad</span>
                    </div>
                </div>

                {/* Hero */}
                <div className="bg-dairy-blue text-white relative overflow-hidden">
                    <div className="absolute inset-0 opacity-25 bg-[url('https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-dairy-blue via-dairy-blue/95 to-dairy-blue/70"></div>
                    
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-32 relative z-10">
                        <div className="md:w-4/5">
                            <div className="inline-flex items-center space-x-2 bg-dairy-green/20 border border-dairy-green/40 text-dairy-green px-3.5 py-1.5 rounded-full text-xs font-semibold mb-6">
                                <i className="ph ph-lightning text-sm"></i>
                                <span>Plataforma Inteligente B2B | A member of Grupo Proselacsa</span>
                            </div>
                            <h1 className="text-4xl md:text-6xl font-extrabold leading-tight mb-6 tracking-tight">
                                La Inteligencia y el Suministro Confiable de Insumos Lácteos en México
                            </h1>
                            <p className="text-lg md:text-xl font-light mb-10 text-gray-300 leading-relaxed">
                                Compra leche en polvo a menudeo y medio mayoreo (presentación en sacos de 25 kg) con disponibilidad inmediata desde nuestro CEDIS en León, Gto. 
                            </p>
                            <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mb-12">
                                <button onClick={() => setCurrentPage('productos')} className="bg-dairy-green text-white px-8 py-4 rounded-lg font-bold hover:bg-green-600 transition shadow-lg flex items-center justify-center text-lg border-2 border-dairy-green">
                                    <i className="ph ph-shopping-cart mr-2 text-2xl"></i> Ver Inventario en Vivo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        /* SECCIÓN: PRODUCTOS CON CONEXIÓN ODOO VÍA API */
        const Productos = ({ openModal, setCurrentPage }) => {
            const [stockOdoo, setStockOdoo] = useState("Consultando ERP...");
            const [precioOdoo, setPrecioOdoo] = useState("");

            useEffect(() => {
                fetch(`${API_BASE_URL}/api/estoque/LDP-DA01`)
                    .then(res => res.json())
                    .then(data => {
                        if(data.stock !== undefined) {
                            // El backend ya hace la conversión, aquí solo mostramos "sacos" y el precio resultante
                            setStockOdoo(`${Math.floor(data.stock)} sacos disponibles`);
                            setPrecioOdoo(`$${data.precio_mxn.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN / Saco`);
                        } else {
                            setStockOdoo("Stock por confirmar");
                        }
                    })
                    .catch(() => setStockOdoo("Stock por confirmar en CEDIS"));
            }, []);

            const currentProducts = [
                { 
                    sku: "LDP-DA01", 
                    name: "Leche Descremada en Polvo (NFDM / SMP)", 
                    brand: "DairyAmerica",
                    origin: "Importación (EE.UU.)", 
                    format: "Saco 25 kg", 
                    desc: "Nonfat Dry Milk Grado A, proceso Spray. Ideal para aportar sólidos lácteos no grasos.",
                    image: "./image_2cccac.png",
                    ficha: "FICHA TECNICA LDP-DA.pdf" 
                }
            ];

            return (
                <div className="py-16 bg-gray-50 fade-in min-h-screen">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-end mb-8 border-b border-gray-200 pb-4">
                            <h2 className="text-3xl font-bold text-dairy-blue">Catálogo de Productos</h2>
                        </div>
                        
                        <div className="mb-12">
                            <h3 className="text-xl font-bold text-gray-700 mb-6 flex items-center"><i className="ph ph-check-circle text-dairy-green mr-2 text-2xl"></i> Disponibles Hoy (CEDIS León)</h3>
                            
                            {currentProducts.map((p, i) => (
                                <div key={i} className="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden flex flex-col md:flex-row mb-6">
                                    <div className="md:w-2/5 bg-white p-6 flex items-center justify-center border-b md:border-b-0 md:border-r border-gray-200 relative min-h-[300px]">
                                        <img src={p.image} alt={p.name} className="max-h-80 object-contain drop-shadow-2xl hover:scale-105 transition-transform duration-300" onError={(e)=>{e.target.style.display='none';}} />
                                    </div>
                                    <div className="md:w-3/5 p-8 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center space-x-3 mb-3 flex-wrap gap-y-2">
                                                <span className="bg-blue-100 text-dairy-blue text-xs font-extrabold px-3 py-1 rounded uppercase tracking-wider border border-blue-200">
                                                    Marca: {p.brand}
                                                </span>
                                                <span className="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded whitespace-nowrap flex items-center">
                                                    <i className="ph ph-package mr-1"></i> {stockOdoo}
                                                </span>
                                                {precioOdoo && (
                                                    <span className="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded whitespace-nowrap flex items-center">
                                                        <i className="ph ph-tag mr-1"></i> {precioOdoo}
                                                    </span>
                                                )}
                                            </div>
                                            <h3 className="text-2xl font-bold text-gray-900 mb-4">{p.name}</h3>
                                            <p className="text-gray-600 mb-6 text-lg">{p.desc}</p>
                                        </div>
                                        <div className="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                                            <button onClick={() => setCurrentPage('comprar')} className="flex-1 bg-dairy-green text-white py-3 px-4 rounded-lg font-bold hover:bg-green-600 transition shadow flex justify-center items-center">
                                                <i className="ph ph-credit-card mr-2 text-xl"></i> Pagar Pedido
                                            </button>
                                            <a href={`./${p.ficha}`} download={p.ficha} className="flex-1 bg-white border-2 border-dairy-blue text-dairy-blue py-3 px-2 rounded-lg font-bold hover:bg-blue-50 transition shadow flex justify-center items-center">
                                                <i className="ph ph-file-pdf mr-2 text-xl"></i> Ficha Técnica
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Comprar = ({ showToast }) => {
            const requestPaymentLink = async (provider) => {
                showToast(`Generando enlace seguro con ${provider}...`);
                try {
                    const response = await fetch(`${API_BASE_URL}/api/pagar/${provider}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount: 1950.00, currency: "MXN", description: "Saco Leche en Polvo 25kg DAIRYCOM" })
                    });
                    const data = await response.json();
                    if(data.payment_url) {
                        window.location.href = data.payment_url;
                    } else {
                        showToast(`El servicio de ${provider} está en configuración.`);
                    }
                } catch (error) {
                    showToast(`Error al conectar con ${provider}. Intente más tarde.`);
                }
            };

            return (
                <div className="py-16 bg-gray-100 fade-in min-h-screen">
                    <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-bold text-dairy-blue mb-4">Portal de Compra Segura</h2>
                            <p className="text-gray-600 text-lg">Seleccione el método de pago (MXN) para liquidar su pedido.</p>
                        </div>

                        <div className="grid md:grid-cols-2 gap-10">
                            {/* Pago Manual */}
                            <div className="bg-white rounded-2xl shadow-xl border-t-8 border-dairy-blue overflow-hidden relative p-10">
                                <h3 className="text-2xl font-bold text-gray-900 mb-4">Transferencia / SPEI</h3>
                                <p className="text-base text-gray-600 mb-8">Pago directo a cuenta empresarial.</p>
                                <div className="bg-gray-50 rounded-xl p-6 border border-gray-200 space-y-5">
                                    <div><p className="text-xs font-bold text-gray-500 uppercase">Beneficiario</p><p className="font-bold text-gray-900 text-lg">PROSELACSA</p></div>
                                    <div><p className="text-xs font-bold text-gray-500 uppercase">Banco</p><p className="font-semibold text-dairy-blue text-lg">BBVA</p></div>
                                    <div className="flex justify-between items-center"><p className="font-mono font-bold text-dairy-blue text-lg">CLABE: 012222001175491212</p></div>
                                </div>
                            </div>

                            {/* Pasarelas de Pago */}
                            <div className="bg-white rounded-2xl shadow-xl border border-gray-200 relative overflow-hidden flex flex-col p-10 justify-center items-center text-center">
                                <h3 className="text-2xl font-bold text-gray-800 mb-4">Pago en Línea</h3>
                                <p className="text-base text-gray-500 mb-10">Tarjetas de crédito, débito o saldo digital.</p>
                                <div className="w-full space-y-4">
                                    <button onClick={() => requestPaymentLink('clip')} className="w-full bg-[#FF4F00] text-white font-bold py-4 rounded-lg hover:bg-orange-600 transition flex justify-center items-center text-lg">
                                        <i className="ph ph-credit-card mr-2 text-2xl"></i> Pagar con Clip (Tarjetas)
                                    </button>
                                    <button onClick={() => requestPaymentLink('paypal')} className="w-full bg-[#003087] text-white font-bold py-4 rounded-lg hover:bg-blue-900 transition flex justify-center items-center text-lg">
                                        <i className="ph ph-paypal-logo mr-2 text-2xl"></i> Pagar con PayPal
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LeadModal = ({closeModal}) => <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center"><div className="bg-white p-8 rounded-lg shadow-xl text-center"><h3 className="text-xl font-bold mb-4">Cotización</h3><p className="mb-6">Por favor contáctenos por WhatsApp para cotizaciones personalizadas.</p><button onClick={closeModal} className="bg-dairy-blue text-white px-6 py-2 rounded">Cerrar</button></div></div>;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
